name: Deploy clone ezjkerrstg

# Déploie un CLONE du worker de l'application sous un autre nom, à partir de
# l'archive « api-ai/archive/worker-2026-10-29.js » (état du 28/10 15:03 UTC,
# soit le worker tel qu'il était il y a une semaine jour pour jour).
# Le worker « api-ai » n'est pas touché.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api-ai/archive/worker-2026-10-29.js'
      - 'scripts/deploy-clone.cjs'
      - '.github/workflows/deploy-clone.yml'

concurrency:
  group: deploy-clone
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Mise à jour de ezjkerrstg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déployer le clone
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          RF_TOKEN_1: ${{ secrets.RF_TOKEN_1 }}
          RF_TOKEN_2: ${{ secrets.RF_TOKEN_2 }}
          RF_TOKEN_3: ${{ secrets.RF_TOKEN_3 }}
          ROBOFLOW_API_KEY_1: ${{ secrets.ROBOFLOW_API_KEY_1 }}
          ROBOFLOW_API_KEY_2: ${{ secrets.ROBOFLOW_API_KEY_2 }}
          ROBOFLOW_API_KEY_3: ${{ secrets.ROBOFLOW_API_KEY_3 }}
          ROBOFLOW_API_KEY_4: ${{ secrets.ROBOFLOW_API_KEY_4 }}
          ROBOFLOW_API_KEY_5: ${{ secrets.ROBOFLOW_API_KEY_5 }}
          ROBOFLOW_API_KEY_6: ${{ secrets.ROBOFLOW_API_KEY_6 }}
          ROBOFLOW_API_KEY_7: ${{ secrets.ROBOFLOW_API_KEY_7 }}
          ROBOFLOW_API_KEY_8: ${{ secrets.ROBOFLOW_API_KEY_8 }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          IFM_API_KEY: ${{ secrets.IFM_API_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WORKER_NAME: ezjkerrstg
        run: node scripts/deploy-clone.cjs
