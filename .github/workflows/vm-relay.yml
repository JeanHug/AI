name: Web VM Linux Persistent Relay

on:
  workflow_dispatch:
    inputs:
      relay_cycle:
        description: 'Numéro du cycle de relais Linux'
        required: false
        default: '1'
      session_id:
        description: 'Identifiant de session unique'
        required: false
        default: 'session-linux'
      sync_interval_mins:
        description: 'Intervalle de sauvegarde (en minutes)'
        required: false
        default: '10'
      relay_trigger_mins:
        description: 'Temps avant lancement du runner suivant (minutes)'
        required: false
        default: '315'
      relay_shutdown_mins:
        description: 'Temps avant arrêt du runner actuel (minutes)'
        required: false
        default: '345'

concurrency:
  group: vm-linux-group
  cancel-in-progress: false

jobs:
  run-linux-vm:
    name: 'Linux Relay Cycle ${{ github.event.inputs.relay_cycle || 1 }}'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Restore Persistent Data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/backup-sync.sh restore

      - name: Start Web Desktop (Google Chrome & Docs)
        run: |
          ./scripts/setup-desktop.sh

      - name: Auto-Configure & Start Cloudflare Tunnel
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
        run: |
          ./scripts/start-tunnel.sh

      - name: Run Linux Relay Orchestrator & Continuous Backup
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
          RELAY_CYCLE: ${{ github.event.inputs.relay_cycle || 1 }}
          SESSION_ID: ${{ github.event.inputs.session_id || 'session-linux' }}
          SYNC_INTERVAL_MINS: ${{ github.event.inputs.sync_interval_mins || 10 }}
          RELAY_TRIGGER_MINS: ${{ github.event.inputs.relay_trigger_mins || 315 }}
          RELAY_SHUTDOWN_MINS: ${{ github.event.inputs.relay_shutdown_mins || 345 }}
        run: |
          ./scripts/relay-orchestrator.sh
