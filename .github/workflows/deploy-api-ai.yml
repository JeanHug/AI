name: Deploy worker api-ai (application)

# Déploie le worker "api-ai" : l'application (/app) et ses API (/api/chat,
# /api/image, /api/agent/* en relais vers la VM de l'agent).
# La liaison de service VMAI est re-déclarée à chaque déploiement (sans quoi
# les routes /api/agent/* tombent en erreur Cloudflare 1042).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api-ai/worker.js'
      - 'api-ai/index.html'
      - 'scripts/deploy-api-ai.cjs'
      - '.github/workflows/deploy-api-ai.yml'

concurrency:
  group: deploy-api-ai
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Mise à jour de api-ai
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déployer le worker api-ai
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          # Jetons Roboflow supplémentaires (même organisation) : posés en
          # secrets du worker par le script — rotation des jetons.
          RF_TOKEN_1: ${{ secrets.RF_TOKEN_1 }}
          RF_TOKEN_2: ${{ secrets.RF_TOKEN_2 }}
          RF_TOKEN_3: ${{ secrets.RF_TOKEN_3 }}
          # Jetons Roboflow nommés : ROBOFLOW_API_KEY_1 … _8. C'est cette
          # famille qui fait foi ; les RF_TOKEN_* restent pour ne rien perdre.
          ROBOFLOW_API_KEY_1: ${{ secrets.ROBOFLOW_API_KEY_1 }}
          ROBOFLOW_API_KEY_2: ${{ secrets.ROBOFLOW_API_KEY_2 }}
          ROBOFLOW_API_KEY_3: ${{ secrets.ROBOFLOW_API_KEY_3 }}
          ROBOFLOW_API_KEY_4: ${{ secrets.ROBOFLOW_API_KEY_4 }}
          ROBOFLOW_API_KEY_5: ${{ secrets.ROBOFLOW_API_KEY_5 }}
          ROBOFLOW_API_KEY_6: ${{ secrets.ROBOFLOW_API_KEY_6 }}
          ROBOFLOW_API_KEY_7: ${{ secrets.ROBOFLOW_API_KEY_7 }}
          ROBOFLOW_API_KEY_8: ${{ secrets.ROBOFLOW_API_KEY_8 }}
          # Clé NVIDIA NIM : posée elle aussi en secret du worker, réservée aux
          # modèles NVIDIA NIM (ajoutés plus tard). Aucun modèle n'est activé ici.
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          # Clé ModelScope (jetons « ms-… ») : posée en secret du worker, prête
          # pour les modèles à ajouter plus tard.
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          # Clé IFM (passerelle OpenAI-compatible, K2 Horizon) : posée en secret
          # du worker. Aucune valeur dans le dépôt, aucun affichage.
          IFM_API_KEY: ${{ secrets.IFM_API_KEY }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          # Jeton Hugging Face (facultatif) : lève le quota ZeroGPU anonyme des
          # Spaces d'image (Ideogram notamment). Absent : rien ne change.
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORKER_NAME: api-ai
        run: node scripts/deploy-api-ai.cjs
